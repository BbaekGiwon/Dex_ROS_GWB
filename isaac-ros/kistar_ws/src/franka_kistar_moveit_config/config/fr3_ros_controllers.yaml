controller_manager:
  ros__parameters:
    update_rate: 1000
    fr3_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    franka_robot_state_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster

fr3_arm_controller:
  ros__parameters:
    joints:
      - fr3_joint1
      - fr3_joint2
      - fr3_joint3
      - fr3_joint4
      - fr3_joint5
      - fr3_joint6
      - fr3_joint7
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    gains:
      fr3_joint1: {p: 600.0, d: 30.0, i: 0.0, i_clamp: 1.0}
      fr3_joint2: {p: 600.0, d: 30.0, i: 0.0, i_clamp: 1.0}
      fr3_joint3: {p: 600.0, d: 30.0, i: 0.0, i_clamp: 1.0}
      fr3_joint4: {p: 600.0, d: 30.0, i: 0.0, i_clamp: 1.0}
      fr3_joint5: {p: 250.0, d: 10.0, i: 0.0, i_clamp: 1.0}
      fr3_joint6: {p: 150.0, d: 10.0, i: 0.0, i_clamp: 1.0}
      fr3_joint7: {p: 50.0, d: 5.0, i: 0.0, i_clamp: 1.0}
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      goal_time: 0.5
      stopped_velocity_tolerance: 0.01
      fr3_joint1: {trajectory: 0.05, goal: 0.02}
      fr3_joint2: {trajectory: 0.05, goal: 0.02}
      fr3_joint3: {trajectory: 0.05, goal: 0.02}
      fr3_joint4: {trajectory: 0.05, goal: 0.02}
      fr3_joint5: {trajectory: 0.05, goal: 0.02}
      fr3_joint6: {trajectory: 0.05, goal: 0.02}
      fr3_joint7: {trajectory: 0.05, goal: 0.02}

joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false

franka_robot_state_broadcaster:
  ros__parameters:
    lock_try_count: 5
    lock_sleep_interval: 5
    lock_log_error: false
    lock_update_success: true
